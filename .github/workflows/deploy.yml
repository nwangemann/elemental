name: deploy

# Publishes a release to GitHub Pages (ADR 0021). Pushing a `v*` tag deploys that tag; a manual
# run deploys the ref it is given (default: the latest tag), so main's work in progress never
# goes live by itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to deploy (empty for the latest v* tag)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the release
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then REF="$GITHUB_REF_NAME"; else REF=$(git tag --list 'v*' --sort=-v:refname | head -n 1); fi
          fi
          echo "Deploying $REF"
          git checkout --detach "$REF"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The site lives at https://<owner>.github.io/<repo>/, so assets resolve under that path.
      - run: npm run build -- --base "/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
